version: '3.8'

services:
  # --- Database ---
  db:
    image: postgres:15-alpine
    restart: always
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    environment:
      POSTGRES_USER: tesla
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-teslapass}
      POSTGRES_DB: tesladb
  
  certbot:
    image: certbot/certbot
    volumes:
      - ./certbot/www:/var/www/certbot:z
      - ./certbot/conf:/etc/letsencrypt:z

  # --- Nginx Gateway ---
  gateway:
    image: nginx:latest
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx-gateway/conf.d:/etc/nginx/conf.d:z
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:z
    depends_on:
      - backend
      - shop
      - admin

  # --- Backend ---
  backend:
    build:
      context: ./tesla-parts-backend
    restart: always
    volumes:
      - ./tesla-parts-backend/static/images:/app/static/images:z
    environment:
      DATABASE_URL: "postgresql://tesla:${POSTGRES_PASSWORD:-teslapass}@db:5432/tesladb"
      FRONTEND_URL: "https://teslafix.com.ua"
      BACKEND_URL: "https://api.teslafix.com.ua"
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-super-secret-jwt-key}
      SMTP_EMAIL: ${SMTP_EMAIL:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
    depends_on:
      - db
      
  # --- Shop Frontend ---
  shop:
    build:
      context: ./tesla-parts-shop
      args:
        NEXT_PUBLIC_API_URL: https://api.teslafix.com.ua
    restart: always

  # --- Admin Frontend ---
  admin:
    build:
      context: ./tesla-parts-admin
      args:
        VITE_API_URL: https://api.teslafix.com.ua
    restart: always

volumes:
  postgres_data:
